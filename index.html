<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite especial</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #8e2de2, #4a00e0);
    }

    main {
      width: min(100%, 520px);
      padding: 42px 28px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
    }

    .emoji {
      font-size: 58px;
    }

    h1 {
      margin: 12px 0 16px;
      font-size: 42px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    .detalhes {
      margin-top: 28px;
      padding: 18px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.14);
    }
  </style>
</head>

<body>
  <main>
    <div class="emoji">🎉</div>
    <h1>Você está convidado!</h1>

    <p>Preparamos um momento especial e queremos celebrar com você.</p>

    <div class="detalhes">
      <p><strong>📅 Data:</strong> em breve</p>
      <p><strong>⏰ Horário:</strong> em breve</p>
      <p><strong>📍 Local:</strong> em breve</p>
    </div>
  </main>
</body>
</html>
